# Hand-labelled gold set for the account-classify feature (30 accounts, 15 prospects / 15 not).
#
# Labelling policy (the product decision, written down so labels are consistent):
#   - is_prospect = the account is an organisation defending ITS OWN systems (business, education,
#     government, healthcare provider, nonprofit). Hosting providers, ISPs/telcos and multi-tenant
#     platforms are NOT prospects even when they are large companies: their scanned IP space is
#     mostly their customers', so the findings are not theirs to fix and the pitch doesn't land.
#   - industry: `industry_ok` lists every answer we accept when the honest answer is ambiguous.
#   - difficulty: easy = domain/cert names the entity; medium = needs judgement; hard = misleading clues
#     (keyword traps like "bank", tenant page titles, customer devices on an ISP's network).
#
# Excluded on purpose: the four accounts used as few-shot examples in account-classify/v2
# (rose-hulman.edu, ReadyIDC Co.,Ltd., watchguard.com, leadpops.com) so v2 can't score by memorisation.
#
# Provenance: candidates sampled by stratum (top-tier / org-keyed / domain-keyed / rDNS-keyed / keyword
# traps) with evals/sample_candidates.py; labels drafted by the author with an AI assistant from each
# account card plus public knowledge of the organisation. STATUS: pending human review.
labelled_by: author + AI assistant (draft)
reviewed: false
